<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        body {
            background-color:#f6f3f0;
            text-align:center;
        }
        .gpm {
            width: 100px;
            height: 100px;
            margin: 5px auto;
            border: 4px solid rgb(207, 221, 190);
            border-radius: 2%;
            background-color: #064e3b;
            color:lavender;

            font-family: Arial;
            font-size: 25px;
            font-weight: bold;
            line-height: 100px;

        }
        .card {
            width: 350px;
            height: 500px;
            margin: 30px auto;
            padding: 20px;
            border: 3px solid white;
            box-sizing: border-box;
            background-color: white;
            box-shadow: 5px 5px 15px 5px purple,
                        -5px -5px 15px 5px orange,
                        0px 10px 20px 5px pink;
        
        }

        h1 {
            font-family: Georgia, serif, cursive, fantasy;
            font-size: 30px;
            font-style: oblique;
            font-weight: 800;
            font-variant: small-caps;
            text-align: center;
            text-decoration: underline;
            text-transform: capitalize;
            letter-spacing: 1px;
        }

        p {
            font-family: Georgia, serif, cursive, fantasy;
            font-size: 14px;
            font-style: normal;
            text-align: center;
            word-spacing: 3px;
            line-height: 1;
        }

        h3 {
            font-family: Georgia, serif, cursive, fantasy;
            font-size: 18px;
            font-style: normal;
            text-align: center;
            word-spacing: 2px;
            line-height: 1.5;
            background-color: #eef0f3;
        }

        h2 {
            font-family: Georgia, serif, cursive, fantasy;
            font-size: 20px;
            font-style: normal;
            text-align: center;
            word-spacing: 3px;
            line-height: 1.5;
        }

    </style>
</head>
<body>
    <div class = "card">
        <div class="gpm">
        <img src = "img.png" alt = "no image found" width = "100" height = "100">
        </div>

        <h1>Sanghavi</h1>
        <h2>Student Profile</h2>
        <p>
            Aspiring Software Developer
            passionate about learning new technologies.
        </p><hr>
        <h3>Skills & Topics:</h3>
        <p>
            Python | SQL | HTML | CSS
        </p>
        <h3>About Me:</h3>
        <p>
            I am a dedicated student with a strong passion for technology and innovation. I enjoy solving problems and learning new skills.
        </p>
    </div>
</body>
</html>
